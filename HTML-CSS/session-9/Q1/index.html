<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flipkart Product Cards</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5">
    <div class="row">

       
        <div class="col-md-4 mb-4">
            <div class="card h-100 shadow">
                <img src="https://via.placeholder.com/250x200" class="card-img-top" alt="Product">
                <div class="card-body">
                    <h5 class="card-title">Wireless Headphones</h5>
                    <p class="card-text">High-quality sound with noise cancellation.</p>
                    <h4 class="text-success">₹1,999</h4>
                    <button class="btn btn-primary w-100">Buy Now</button>
                </div>
            </div>
        </div>

       
        <div class="col-md-4 mb-4">
            <div class="card h-100 shadow">
                <img src="https://via.placeholder.com/250x200" class="card-img-top" alt="Product">
                <div class="card-body">
                    <h5 class="card-title">Smart Watch</h5>
                    <p class="card-text">Fitness tracking with heart rate monitor.</p>
                    <h4 class="text-success">₹2,499</h4>
                    <button class="btn btn-primary w-100">Buy Now</button>
                </div>
            </div>
        </div>

       
        <div class="col-md-4 mb-4">
            <div class="card h-100 shadow">
                <img src="https://via.placeholder.com/250x200" class="card-img-top" alt="Product">
                <div class="card-body">
                    <h5 class="card-title">Bluetooth Speaker</h5>
                    <p class="card-text">Portable speaker with powerful bass.</p>
                    <h4 class="text-success">₹1,499</h4>
                    <button class="btn btn-primary w-100">Buy Now</button>
                </div>
            </div>
        </div>

    </div>
</div>


<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
