<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Movie Details</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5">
    <div class="row align-items-center">

        <!-- Movie Poster -->
        <div class="col-12 col-md-6 mb-3">
            <img src="https://via.placeholder.com/300x450"
                 class="img-fluid rounded shadow"
                 alt="Movie Poster">
        </div>

        <!-- Movie Details -->
        <div class="col-12 col-md-6">
            <h2>Avengers: Endgame</h2>
            <p><strong>Genre:</strong> Action, Adventure, Sci-Fi</p>
            <p><strong>Rating:</strong> ⭐ 8.9/10</p>
            <p>
                The Avengers unite for one final battle to save the universe from Thanos.
            </p>

            <button class="btn btn-danger">
                Book Now
            </button>
        </div>

    </div>
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
