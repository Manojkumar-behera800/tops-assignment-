<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Music Artist Landing Page</title>

    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- CSS File -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

    <img src="a1.jpg" alt="Artist Image" class="profile-img">

    <h1>Arijit Singh</h1>

    <p class="bio">
        Arijit Singh is one of India's most popular playback singers,
        known for his soulful voice and hit songs in Bollywood.
    </p>

    <div class="social-buttons">
        <a href="#" class="btn facebook">
            <i class="bi bi-facebook"></i> Facebook
        </a>

        <a href="#" class="btn instagram">
            <i class="bi bi-instagram"></i> Instagram
        </a>

        <a href="#" class="btn youtube">
            <i class="bi bi-youtube"></i> YouTube
        </a>
    </div>

</div>

</body>
</html>
