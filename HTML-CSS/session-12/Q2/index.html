<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spotify Featured Playlists</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background-color: #121212;
            color: white;
        }

        .playlist-card {
            background-color: #1e1e1e;
            border: none;
            transition: transform 0.3s ease;
        }

        .playlist-card:hover {
            transform: scale(1.05);
        }

        .playlist-card img {
            height: 220px;
            object-fit: cover;
        }

        .btn-spotify {
            background-color: #1DB954;
            color: white;
            border: none;
        }

        .btn-spotify:hover {
            background-color: #18a64b;
            color: white;
        }
    </style>
</head>
<body>

<div class="container py-5">
    <h2 class="text-center mb-5">🎵 Featured Playlists</h2>

    <div class="row g-4">

        <!-- Playlist 1 -->
        <div class="col-lg-4 col-md-6">
            <div class="card playlist-card text-center h-100">
                <img src="https://picsum.photos/400/300?random=1" class="card-img-top" alt="Playlist">
                <div class="card-body">
                    <h5 class="card-title">Top Hits 2026</h5>
                    <p class="card-text text-light">
                        Enjoy today's biggest chartbusters.
                    </p>
                    <a href="#" class="btn btn-spotify">Listen Now</a>
                </div>
            </div>
        </div>

        <!-- Playlist 2 -->
        <div class="col-lg-4 col-md-6">
            <div class="card playlist-card text-center h-100">
                <img src="https://picsum.photos/400/300?random=2" class="card-img-top" alt="Playlist">
                <div class="card-body">
                    <h5 class="card-title">Chill Vibes</h5>
                    <p class="card-text text-light">
                        Relax with calm and soothing music.
                    </p>
                    <a href="#" class="btn btn-spotify">Listen Now</a>
                </div>
            </div>
        </div>

        <!-- Playlist 3 -->
        <div class="col-lg-4 col-md-12">
            <div class="card playlist-card text-center h-100">
                <img src="https://picsum.photos/400/300?random=3" class="card-img-top" alt="Playlist">
                <div class="card-body">
                    <h5 class="card-title">Workout Beats</h5>
                    <p class="card-text text-light">
                        High-energy tracks to boost your workout.
                    </p>
                    <a href="#" class="btn btn-spotify">Listen Now</a>
                </div>
            </div>
        </div>

    </div>
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
