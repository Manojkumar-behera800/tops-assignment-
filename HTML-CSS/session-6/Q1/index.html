<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zomato Restaurant Card</title>

<style>
    body{
        font-family: Arial, sans-serif;
        background-color: #f5f5f5;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
    }

    .card{
        width: 320px;
        background: white;
        border: 2px solid #ddd;
        border-radius: 10px;
        padding: 20px;
        margin: 20px;
        box-shadow: 0 2px 8px rgba(0,0,0,0.2);
    }

    .restaurant-name{
        font-size: 24px;
        font-weight: bold;
        color: #e23744;
        border-bottom: 1px solid #ccc;
        padding-bottom: 10px;
        margin-bottom: 15px;
    }

    .cuisine{
        font-size: 18px;
        color: #555;
        border-bottom: 1px solid #ccc;
        padding: 10px 0;
        margin-bottom: 15px;
    }

    .rating{
        font-size: 18px;
        font-weight: bold;
        color: green;
        padding-top: 10px;
    }
</style>

</head>
<body>

<div class="card">
    <div class="restaurant-name">
        The Spice House
    </div>

    <div class="cuisine">
        Cuisine: North Indian, Chinese
    </div>

    <div class="rating">
        ⭐ 4.5 / 5
    </div>
</div>

</body>
</html>
