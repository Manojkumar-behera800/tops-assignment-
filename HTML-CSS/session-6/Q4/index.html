<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BookMyShow Movie Poster Grid</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    background:#f5f5f5;
    padding:20px;
}

h2{
    text-align:center;
    margin-bottom:20px;
}

/* Movie Grid */
.movie-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit, minmax(180px,1fr));
    gap:20px;
}

/* Poster Card */
.poster{
    position:relative;      /* Parent is relative */
    background:#fff;
    border-radius:10px;
    overflow:hidden;
    box-shadow:0 2px 8px rgba(0,0,0,0.2);
}

.poster img{
    width:100%;
    height:260px;
    display:block;
}

.poster h3{
    text-align:center;
    padding:10px;
}

/* New Badge */
.badge{
    position:absolute;      /* Positioned relative to .poster */
    top:10px;
    left:10px;
    background:red;
    color:white;
    padding:5px 10px;
    border-radius:5px;
    font-size:14px;
    font-weight:bold;
}
</style>

</head>
<body>

<h2>BookMyShow Movie Posters</h2>

<div class="movie-grid">

    <div class="poster">
        <span class="badge">NEW</span>
        <img src="https://via.placeholder.com/180x260?text=Movie+1" alt="Movie 1">
        <h3>Avengers</h3>
    </div>

    <div class="poster">
        <img src="https://via.placeholder.com/180x260?text=Movie+2" alt="Movie 2">
        <h3>Spider-Man</h3>
    </div>

    <div class="poster">
        <img src="https://via.placeholder.com/180x260?text=Movie+3" alt="Movie 3">
        <h3>Batman</h3>
    </div>

    <div class="poster">
        <img src="https://via.placeholder.com/180x260?text=Movie+4" alt="Movie 4">
        <h3>Iron Man</h3>
    </div>

</div>

</body>
</html>
