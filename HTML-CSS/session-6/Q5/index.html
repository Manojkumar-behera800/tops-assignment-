<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reusable CSS Class Example</title>

<style>
body{
    font-family: Arial, sans-serif;
    background:#f5f5f5;
    padding:20px;
}

.spacing{
    margin:15px;
    padding:15px;
}

.card{
    background:white;
    border:1px solid #ccc;
    border-radius:10px;
    box-shadow:0 2px 8px rgba(0,0,0,0.2);
}

.restaurant-name{
    font-size:22px;
    font-weight:bold;
    color:#e23744;
}

.cuisine{
    color:#555;
    margin-top:8px;
}

.rating{
    color:green;
    font-weight:bold;
    margin-top:8px;
}
</style>
</head>

<body>

<div class="card spacing">
    <div class="restaurant-name">The Spice House</div>
    <div class="cuisine">North Indian, Chinese</div>
    <div class="rating">⭐ 4.5 / 5</div>
</div>

<div class="card spacing">
    <div class="restaurant-name">Food Junction</div>
    <div class="cuisine">Italian, Fast Food</div>
    <div class="rating">⭐ 4.3 / 5</div>
</div>

</body>
</html>
