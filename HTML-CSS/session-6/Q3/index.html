<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WhatsApp Notification Badge</title>

<style>
body{
    font-family: Arial, sans-serif;
    margin: 0;
    padding: 20px;
    background: #f5f5f5;
}

/* Demo content */
.content{
    height: 1500px;
}

h2{
    text-align: center;
}

/* WhatsApp Button */
.whatsapp-btn{
    position: fixed;
    bottom: 20px;
    right: 20px;
    background: #25D366;
    color: white;
    width: 60px;
    height: 60px;
    border-radius: 50%;
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 30px;
    text-decoration: none;
    box-shadow: 0 4px 10px rgba(0,0,0,0.3);
    padding: 5px;
}

/* Notification Badge */
.badge{
    position: absolute;
    top: -5px;
    right: -5px;
    background: red;
    color: white;
    width: 22px;
    height: 22px;
    border-radius: 50%;
    font-size: 13px;
    display: flex;
    justify-content: center;
    align-items: center;
    font-weight: bold;
}
</style>

<!-- Font Awesome -->
<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

</head>
<body>

<div class="content">
    <h2>Scroll Down</h2>
    <p>This page contains extra content so you can see that the WhatsApp notification button stays fixed at the bottom-right corner while scrolling.</p>
</div>

<a href="#" class="whatsapp-btn">
    <i class="fa-brands fa-whatsapp"></i>
    <span class="badge">5</span>
</a>

</body>
</html>
