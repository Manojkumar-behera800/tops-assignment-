<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gamer Tag Bio Link</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    background:#121212;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
    color:white;
}

.container{
    width:90%;
    max-width:400px;
    background:#1f1f1f;
    padding:30px;
    border-radius:15px;
    text-align:center;
    box-shadow:0 0 15px rgba(255,255,255,0.2);
}

.avatar{
    width:120px;
    height:120px;
    border-radius:50%;
    border:4px solid #00ff99;
    object-fit:cover;
    margin-bottom:15px;
}

h2{
    margin-bottom:5px;
}

p{
    color:#cccccc;
    margin-bottom:20px;
}

.links{
    display:flex;
    flex-direction:column;
    gap:15px;
}

.links a{
    text-decoration:none;
    background:#00ff99;
    color:black;
    padding:12px;
    border-radius:8px;
    font-weight:bold;
    transition:0.3s;
}

.links a:hover{
    background:#00cc77;
}

/* Desktop View */
@media (min-width:768px){

.container{
    max-width:700px;
    display:flex;
    align-items:center;
    gap:40px;
    text-align:left;
}

.profile{
    flex:1;
}

.links{
    flex:1;
}
}
</style>

</head>
<body>

<div class="container">

    <div class="profile">
        <img src="https://via.placeholder.com/120" class="avatar" alt="Avatar">

        <h2>ShadowHunter</h2>
        <p>🎮 Pro Gamer | FPS Lover</p>
    </div>

    <div class="links">
        <a href="https://www.twitch.tv/" target="_blank">🎥 Twitch</a>

        <a href="https://discord.com/" target="_blank">💬 Discord</a>

        <a href="https://store.steampowered.com/" target="_blank">🕹️ Steam</a>
    </div>

</div>

</body>
</html>
