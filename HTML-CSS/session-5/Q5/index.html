<!DOCTYPE html>
<html>
<head>

<title>BookMyShow</title>

<style>

body{
    background:white;
    color:black;
    font-family:Arial;
    text-align:center;
    transition:0.5s;
}

.dark-mode{
    background:#222;
    color:white;
}

button{
    padding:10px 20px;
    margin-top:20px;
}

</style>

</head>

<body>

<h1>Movie Details</h1>

<p>Movie: Avengers Endgame</p>

<button onclick="changeMode()">
     Dark Mode
</button>

<script>

function changeMode(){
    document.body.classList.toggle("dark-mode");
}

</script>

</body>
</html>
