<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Favorite Apps</title>

<style>
body{
    font-family: Arial, sans-serif;
    background:#f5f5f5;
    margin:0;
    padding:20px;
}

h2{
    text-align:center;
}

/* Flex Container */
.container{
    display:flex;
    justify-content:space-evenly;
    align-items:center;
    padding:20px;
    background:#ffffff;
    border:2px solid #ccc;
    border-radius:10px;
    margin-top:20px;
}

/* Images */
.container img{
    width:80px;
    height:80px;
    border-radius:15px;
    transition:0.3s;
}

.container img:hover{
    transform:scale(1.1);
}
</style>

</head>
<body>

<h2>My Favorite Apps</h2>

<div class="container">

    <img src="https://upload.wikimedia.org/wikipedia/commons/a/a5/Instagram_icon.png" alt="Instagram">

    <img src="https://upload.wikimedia.org/wikipedia/commons/6/6b/WhatsApp.svg" alt="WhatsApp">

    <img src="https://upload.wikimedia.org/wikipedia/commons/7/75/Zomato_logo.png" alt="Zomato">

    <img src="https://upload.wikimedia.org/wikipedia/commons/8/84/Spotify_icon.svg" alt="Spotify">

</div>

</body>
</html>
