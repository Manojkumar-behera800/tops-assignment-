<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bootstrap Theme Switcher</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div id="mainContainer" class="container mt-5 p-5 bg-light text-dark rounded shadow">

    <h2>BookMyShow</h2>
    <p>Welcome! Click the button below to switch the theme.</p>

    <button id="themeBtn" class="btn btn-primary">
        Switch Theme
    </button>

</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script>
    const container = document.getElementById("mainContainer");
    const button = document.getElementById("themeBtn");

    button.addEventListener("click", function () {

        container.classList.toggle("bg-light");
        container.classList.toggle("bg-dark");

        container.classList.toggle("text-dark");
        container.classList.toggle("text-light");

    });
</script>

</body>
</html>
