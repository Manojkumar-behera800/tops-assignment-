<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zomato Restaurant List</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5">

    <h2 class="text-center mb-4 text-danger">Zomato Restaurant List</h2>

    <div class="row">

        <!-- Restaurant 1 -->
        <div class="col-md-6 mb-4">
            <div class="card shadow">
                <div class="card-body">

                    <h4 class="card-title">Spice Villa</h4>

                    <!-- Rating -->
                    <span class="badge bg-success">⭐ 4.5</span>

                    <!-- Offer -->
                    <span class="badge bg-warning text-dark">20% OFF</span>

                    <!-- Status -->
                    <span class="badge bg-primary">Open</span>

                    <p class="mt-3">
                        North Indian, Chinese, Fast Food
                    </p>

                </div>
            </div>
        </div>

        <!-- Restaurant 2 -->
        <div class="col-md-6 mb-4">
            <div class="card shadow">
                <div class="card-body">

                    <h4 class="card-title">Pizza Hub</h4>

                    <!-- Rating -->
                    <span class="badge bg-success">⭐ 4.2</span>

                    <!-- Offer -->
                    <span class="badge bg-info">Free Delivery</span>

                    <!-- Status -->
                    <span class="badge bg-danger">Closed</span>

                    <p class="mt-3">
                        Pizza, Pasta, Burgers
                    </p>

                </div>
            </div>
        </div>

    </div>

</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
