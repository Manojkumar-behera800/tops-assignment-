<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie Review Card</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5">
    <div class="row justify-content-center">

        <div class="col-md-6">
            <div class="card shadow">

                <img src="https://via.placeholder.com/500x300"
                     class="card-img-top"
                     alt="Movie Poster">

                <div class="card-body">

                    <!-- Movie Title -->
                    <h2 class="card-title display-6 fw-bold">
                        Avengers: Endgame
                    </h2>

                    <!-- Rating -->
                    <p class="fs-4 fw-semibold text-warning">
                        ⭐ 8.9/10
                    </p>

                    <!-- Review -->
                    <p class="fs-6 fw-normal text-secondary">
                        Avengers: Endgame is an exciting action movie with
                        amazing visual effects, emotional storytelling, and
                        unforgettable performances. It is one of the best
                        superhero movies ever made.
                    </p>

                    <button class="btn btn-danger">
                        Read More
                    </button>

                </div>

            </div>
        </div>

    </div>
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
